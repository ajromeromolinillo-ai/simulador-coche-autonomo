<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Simulador Coche Autónomo - Control Condicional IF / THEN / ELSE</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --panel-bg: #1e293b;
      --primary: #3b82f6;
      --text: #f8fafc;
      --border: #334155;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h2 {
      margin: 0 0 15px 0;
      font-size: 1.5rem;
      color: #38bdf8;
    }

    .main-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      max-width: 1050px;
    }

    .canvas-container {
      position: relative;
      background: var(--panel-bg);
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
      border: 1px solid var(--border);
    }

    canvas {
      border: 2px solid var(--border);
      border-radius: 6px;
      display: block;
      background-color: #0f172a;
    }

    .console-panel {
      background: var(--panel-bg);
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
      width: 340px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid var(--border);
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    button:hover {
      background-color: #2563eb;
    }

    button.btn-warning { background-color: #f59e0b; }
    button.btn-warning:hover { background-color: #d97706; }

    button.btn-danger { background-color: #ef4444; }
    button.btn-danger:hover { background-color: #dc2626; }

    button.btn-success { background-color: #10b981; }
    button.btn-success:hover { background-color: #059669; }

    textarea {
      width: 100%;
      height: 140px;
      box-sizing: border-box;
      font-family: monospace;
      padding: 10px;
      background-color: #0f172a;
      color: #38bdf8;
      border: 1px solid var(--border);
      border-radius: 6px;
      resize: none;
    }

    .status-box {
      padding: 10px;
      border-radius: 6px;
      background: #334155;
      font-size: 0.85rem;
      font-weight: bold;
      text-align: center;
      border: 1px solid #475569;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <h2>Simulador Coche Autónomo - Control Condicional IF / THEN / ELSE</h2>

  <div class="main-container">
    <div class="canvas-container">
      <canvas id="gridCanvas" width="520" height="520"></canvas>
    </div>

    <div class="console-panel">
      <div class="status-box" id="statusBox">Estado: Listo (A8, Este)</div>
      
      <label for="commandList"><strong>Consola de Comandos:</strong></label>
      <textarea id="commandList" placeholder="Avanzar&#10;Evaluar Peatones&#10;Evaluar Semáforo&#10;Avanzar"></textarea>

      <div class="controls">
        <button onclick="addCommand('Avanzar')">Avanzar</button>
        <button onclick="addCommand('Girar Izquierda')">Girar Izq.</button>
        <button onclick="addCommand('Girar Derecha')">Girar Der.</button>
        <button class="btn-warning" onclick="addCommand('Evaluar Peatones')">Eval. Peatones</button>
      </div>

      <div class="controls">
        <button onclick="addCommand('Evaluar Semáforo')">Eval. Semáforo</button>
        <button class="btn-danger" onclick="resetSim()">Reiniciar</button>
      </div>

      <div class="controls">
        <button class="btn-success" style="grid-column: span 2;" onclick="runSimulation()">Ejecutar Algoritmo</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gridCanvas');
    const ctx = canvas.getContext('2d');
    const statusBox = document.getElementById('statusBox');

    const cols = 8;
    const rows = 8;
    const cellSize = canvas.width / cols;

    const dirMap = ['Este', 'Sur', 'Oeste', 'Norte'];

    let car = { x: 0, y: 7, dir: 0 }; 
    let isRunning = false;

    // Edificios y bloqueos urbanos
    const buildings = [
      'A1','A2','A3','A4','A6','A7',
      'B1',
      'C1','C3','C4','C6','C7',
      'D1','D3','D4','D6','D7',
      'E1',
      'F1','F3','F4','F6','F7',
      'G1','G3','G4','G6','G7'
    ];

    const forbidden = ['A5', 'C5', 'C8', 'F2', 'H7'];

    // Pasos de peatones independientes en B3 y G5
    const crosswalks = {
      'B3': { hasPedestrian: true, vertical: true },
      'G5': { hasPedestrian: false, vertical: false }
    };

    // Semáforos en B6 y E3
    const trafficLights = {
      'B6': { state: 'red' },
      'E3': { state: 'green' }
    };

    const meta = 'H1';

    // Ciclo de cambiar color de semáforos
    setInterval(() => {
      trafficLights['B6'].state = trafficLights['B6'].state === 'red' ? 'green' : 'red';
      trafficLights['E3'].state = trafficLights['E3'].state === 'red' ? 'green' : 'red';
      drawGrid();
    }, 3500);

    // Ciclo de movimiento peatonal independiente
    setInterval(() => {
      crosswalks['B3'].hasPedestrian = !crosswalks['B3'].hasPedestrian;
      crosswalks['G5'].hasPedestrian = !crosswalks['G5'].hasPedestrian;
      drawGrid();
    }, 4000);

    function getCoord(colIdx, rowIdx) {
      const colLetter = String.fromCharCode(65 + colIdx);
      const rowNum = rowIdx + 1;
      return `${colLetter}${rowNum}`;
    }

    function drawGrid() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const coord = getCoord(c, r);
          const x = c * cellSize;
          const y = r * cellSize;

          ctx.fillStyle = '#1e293b';

          if (buildings.includes(coord)) {
            ctx.fillStyle = '#334155';
          } else if (forbidden.includes(coord)) {
            ctx.fillStyle = '#451a03';
          } else if (coord === meta) {
            ctx.fillStyle = '#3b0764';
          }

          ctx.fillRect(x, y, cellSize, cellSize);
          ctx.strokeStyle = '#475569';
          ctx.lineWidth = 1;
          ctx.strokeRect(x, y, cellSize, cellSize);

          // Dibujar paso de cebra en B3 (vertical) y G5 (horizontal)
          if (crosswalks[coord]) {
            drawCrosswalk(x, y, crosswalks[coord].hasPedestrian, crosswalks[coord].vertical);
          }

          // Etiqueta de coordenada
          ctx.fillStyle = buildings.includes(coord) ? '#64748b' : '#94a3b8';
          ctx.font = '10px sans-serif';
          ctx.fillText(coord, x + 4, y + 12);

          // Entidades de control
          if (forbidden.includes(coord)) {
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(x + cellSize/2, y + cellSize/2, 14, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(x + cellSize/2 - 10, y + cellSize/2 - 3, 20, 6);
          } else if (trafficLights[coord]) {
            drawTrafficLight(x + cellSize/2, y + cellSize/2, trafficLights[coord].state);
          } else if (coord === meta) {
            ctx.font = '20px sans-serif';
            ctx.fillText('🏁', x + 20, y + 42);
          }
        }
      }

      drawCar();
    }

    function drawCrosswalk(x, y, hasPedestrian, isVertical) {
      ctx.fillStyle = '#ffffff';
      const stripeSize = 6;
      const gap = 6;

      if (isVertical) {
        // Franjas verticales (para casillas como B3)
        for (let i = 8; i < cellSize - 8; i += stripeSize + gap) {
          ctx.fillRect(x + i, y + 10, stripeSize, cellSize - 20);
        }
      } else {
        // Franjas horizontales
        for (let i = 8; i < cellSize - 8; i += stripeSize + gap) {
          ctx.fillRect(x + 10, y + i, cellSize - 20, stripeSize);
        }
      }

      // Pictograma de peatón resaltado en rojo
      if (hasPedestrian) {
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 20px sans-serif';
        ctx.fillText('🚶', x + cellSize / 2 - 10, y + cellSize / 2 + 7);
      }
    }

    function drawTrafficLight(cx, cy, state) {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(cx - 10, cy - 18, 20, 36);
      ctx.strokeStyle = '#64748b';
      ctx.strokeRect(cx - 10, cy - 18, 20, 36);

      ctx.fillStyle = state === 'red' ? '#ef4444' : '#450a0a';
      ctx.beginPath();
      ctx.arc(cx, cy - 8, 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = state === 'green' ? '#22c55e' : '#052e16';
      ctx.beginPath();
      ctx.arc(cx, cy + 8, 6, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawCar() {
      const cx = car.x * cellSize + cellSize / 2;
      const cy = car.y * cellSize + cellSize / 2;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate((car.dir * 90 * Math.PI) / 180);

      ctx.fillStyle = '#000000';
      ctx.fillRect(-14, -15, 8, 5);
      ctx.fillRect(6, -15, 8, 5);
      ctx.fillRect(-14, 10, 8, 5);
      ctx.fillRect(6, 10, 8, 5);

      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.roundRect(-16, -12, 32, 24, 4);
      ctx.fill();

      ctx.fillStyle = '#0284c7';
      ctx.fillRect(2, -9, 8, 18);

      ctx.fillStyle = '#fef08a';
      ctx.fillRect(14, -10, 2, 4);
      ctx.fillRect(14, 6, 2, 4);

      ctx.restore();
    }

    function addCommand(cmd) {
      if (isRunning) return;
      const area = document.getElementById('commandList');
      area.value += (area.value ? '\n' : '') + cmd;
    }

    function resetSim() {
      isRunning = false;
      car = { x: 0, y: 7, dir: 0 };
      document.getElementById('commandList').value = '';
      statusBox.style.background = '#334155';
      statusBox.style.color = '#f8fafc';
      statusBox.innerText = 'Estado: Listo (A8, Este)';
      drawGrid();
    }

    // Algoritmo condicional IF / THEN / ELSE para Semáforo
    async function evaluateTrafficLight(coord) {
      const light = trafficLights[coord];
      if (light) {
        if (light.state === 'red') {
          statusBox.innerText = `IF (Semáforo == ROJO) THEN: Detenerse en ${coord} y esperar luz verde...`;
          while (light.state === 'red') {
            await new Promise(r => setTimeout(r, 200));
          }
          statusBox.innerText = `Luz cambió a VERDE. Reanudando marcha en ${coord}.`;
        } else {
          statusBox.innerText = `ELSE (Semáforo == VERDE): Paso libre en ${coord}. Avanzar.`;
        }
      } else {
        statusBox.innerText = `Sin semáforo en la casilla ${coord}.`;
      }
    }

    // Algoritmo condicional IF / THEN / ELSE para Paso de Peatones
    async function evaluatePedestrianCrosswalk(coord) {
      const crosswalk = crosswalks[coord];
      if (crosswalk) {
        if (crosswalk.hasPedestrian) {
          statusBox.innerText = `IF (Peatón == TRUE) THEN: Detener vehículo en ${coord} hasta que cruce...`;
          while (crosswalk.hasPedestrian) {
            await new Promise(r => setTimeout(r, 200));
          }
          statusBox.innerText = `Paso despejado en ${coord}. Reanudando marcha.`;
        } else {
          statusBox.innerText = `ELSE (Peatón == FALSE): Paso de cebra despejado en ${coord}. Continuar.`;
        }
      } else {
        statusBox.innerText = `Sin paso de cebra en la casilla ${coord}.`;
      }
    }

    async function runSimulation() {
      if (isRunning) return;
      isRunning = true;

      const rawCmds = document.getElementById('commandList').value.split('\n');
      const cmds = rawCmds.map(c => c.trim()).filter(c => c !== '');

      for (let i = 0; i < cmds.length; i++) {
        if (!isRunning) return;
        const cmd = cmds[i];
        await new Promise(r => setTimeout(r, 400));

        if (cmd === 'Avanzar') {
          let nx = car.x;
          let ny = car.y;

          if (car.dir === 0) nx++;      
          else if (car.dir === 1) ny++; 
          else if (car.dir === 2) nx--; 
          else if (car.dir === 3) ny--; 

          if (nx < 0 || nx >= cols || ny < 0 || ny >= rows) {
            triggerError('¡Choque fuera de los límites del plano!');
            isRunning = false;
            return;
          }

          const targetCoord = getCoord(nx, ny);

          if (buildings.includes(targetCoord)) {
            triggerError(`Colisión contra edificio en ${targetCoord}`);
            isRunning = false;
            return;
          }
          if (forbidden.includes(targetCoord)) {
            triggerError(`Infracción: Dirección prohibida en ${targetCoord}`);
            isRunning = false;
            return;
          }

          car.x = nx;
          car.y = ny;

        } else if (cmd === 'Girar Izquierda') {
          car.dir = (car.dir + 3) % 4;
        } else if (cmd === 'Girar Derecha') {
          car.dir = (car.dir + 1) % 4;
        } else if (cmd === 'Evaluar Semáforo') {
          const currentCoord = getCoord(car.x, car.y);
          await evaluateTrafficLight(currentCoord);
        } else if (cmd === 'Evaluar Peatones') {
          const currentCoord = getCoord(car.x, car.y);
          await evaluatePedestrianCrosswalk(currentCoord);
        }

        const currentCoord = getCoord(car.x, car.y);
        if (!statusBox.innerText.includes('IF') && !statusBox.innerText.includes('ELSE')) {
          statusBox.innerText = `Posición: ${currentCoord} | Dir: ${dirMap[car.dir]}`;
        }
        drawGrid();

        if (currentCoord === meta) {
          statusBox.style.background = '#8b5cf6';
          statusBox.style.color = '#ffffff';
          statusBox.innerText = '¡Objetivo alcanzado! ¡Llegada a META!';
          isRunning = false;
          return;
        }
      }
      isRunning = false;
    }

    function triggerError(msg) {
      statusBox.style.background = '#ef4444';
      statusBox.style.color = '#ffffff';
      statusBox.innerText = msg;
    }

    drawGrid();
  </script>

</body>
</html>
